<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO-FUTURISTIC CHRONO-CORE v3088</title>
    <!-- Retro Futuristic Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --bg-dark: #05030a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* 3D Retro Grid Zemin */
        .grid-background {
            position: absolute;
            width: 200%;
            height: 200%;
            bottom: -50%;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 127, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(75deg);
            animation: gridMove 2s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: rotateX(75deg) translateY(0); }
            100% { transform: rotateX(75deg) translateY(50px); }
        }

        /* CRT Scanline Efekti */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* Saat Konteynırı */
        .clock-card {
            position: relative;
            z-index: 5;
            background: rgba(10, 5, 20, 0.75);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 40px 60px;
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.3),
                inset 0 0 15px rgba(255, 0, 127, 0.3);
            backdrop-filter: blur(10px);
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .header-tag {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-yellow);
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--neon-yellow);
        }

        /* Saat Metni ve Neon Parlamaları */
        .time-display {
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 6px;
            text-shadow: 
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dots {
            color: var(--neon-cyan);
            animation: blink 1s infinite;
            text-shadow: 0 0 15px var(--neon-cyan);
            margin: 0 5px;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Tarih ve Bilgi Paneli */
        .date-display {
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
            font-size: 18px;
            letter-spacing: 3px;
            margin-top: 20px;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            border-top: 1px dashed rgba(0, 243, 255, 0.3);
            padding-top: 10px;
        }

        .status-item span {
            color: var(--neon-yellow);
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>
    <div class="scanlines"></div>

    <div class="clock-card" id="clockCard">
        <div class="header-tag">// SYSTEM_TIME :: CHRONO_CORE_v3088</div>
        
        <div class="time-display">
            <span id="hours">00</span>
            <span class="dots">:</span>
            <span id="minutes">00</span>
            <span class="dots">:</span>
            <span id="seconds">00</span>
        </div>

        <div class="date-display" id="dateDisplay">YYYY-MM-DD // DAY</div>

        <div class="status-bar">
            <div class="status-item">SYNC: <span id="syncStatus">ONLINE</span></div>
            <div class="status-item">FPS: <span>60.0</span></div>
            <div class="status-item">LOC: <span id="locationCode">SECTOR 07</span></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Saat, Dakika, Saniye hesapla
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            // Tarih Hesapla
            const lang = localStorage.getItem('lang') || 'tr';
            const daysDict = {
                'tr': ['PAZAR', 'PAZARTESİ', 'SALI', 'ÇARŞAMBA', 'PERŞEMBE', 'CUMA', 'CUMARTESİ'],
                'en': ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'],
                'es': ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'],
                'fr': ['DIMANCHE', 'LUNDI', 'MARDI', 'MERCREDI', 'JEUDI', 'VENDREDI', 'SAMEDI'],
                'de': ['SONNTAG', 'MONTAG', 'DIENSTAG', 'MITTWOCH', 'DONNERSTAG', 'FREITAG', 'SAMSTAG'],
                'ru': ['ВОСКРЕСЕНЬЕ', 'ПОНЕДЕЛЬНИК', 'ВТОРНИК', 'СРЕДА', 'ЧЕТВЕРГ', 'ПЯТНИЦА', 'СУББОТА']
            };
            const days = daysDict[lang] || daysDict['en'];
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dayName = days[now.getDay()];

            document.getElementById('dateDisplay').textContent = `${year}.${month}.${day} // ${dayName}`;
        }

        // Mouse Hareketiyle 3D Parallax Efekti
        const card = document.getElementById('clockCard');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Her saniye güncelle
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
