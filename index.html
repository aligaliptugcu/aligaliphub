  <style>
    body {
      background-color: #eeeeee;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background-color 0.3s;
      font-family: "Pixelify Sans", "Press Start 2P", sans-serif;
      position: relative;
    }
    
    body.dark-mode {
      background-color: #121212;
      color: #ffffff;
    }

    .logo {
      position: absolute;
      top: 30px;
      left: 20px;
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 5px;
    }

    .top-right-controls {
      position: absolute;
      top: 10px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 15px;
      z-index: 10;
    }
    
    .control-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }

    .reader-container {
      margin-top: 10px;
      cursor: pointer;
      position: relative;
    }

    .reader-container img {
      width: 150px;
      pointer-events: none;
    }
    
    .reader-container.drag-over {
      outline: 2px dashed #000;
    }
    
    body.dark-mode .reader-container.drag-over {
      outline-color: #fff;
    }

    .main-content {
      max-width: 1000px;
      margin: 0 auto;
      padding-top: 30px;
      padding-bottom: 10px;
      text-align: center;
    }
    
    h1 {
      font-size: 3rem;
      margin: 0;
      font-weight: bold;
    }
    
    p.subtitle {
      font-size: 1.2rem;
      margin-top: 5px;
      margin-bottom: 40px;
      color: #666;
    }
    
    body.dark-mode p.subtitle {
      color: #aaa;
    }
    
    body.dark-mode #language-select {
      background: #1e1e1e;
      color: #fff;
      border-color: #333;
    }
    
    /* Disket Kutusu (Arşiv) */
    .archive-box {
      background-color: #f0f0f0;
      border-radius: 8px;
      border: 2px solid #ccc;
      border-bottom: 5px solid #aaa;
      border-right: 5px solid #aaa;
      box-shadow: inset 0px 5px 15px rgba(0,0,0,0.05), 0 10px 20px rgba(0,0,0,0.05);
      padding: 40px 30px;
      margin: 0 auto;
      max-width: 800px;
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    body.dark-mode .archive-box {
      background-color: #1e1e1e;
      border-color: #333;
      border-bottom-color: #111;
      border-right-color: #111;
      box-shadow: inset 0px 5px 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5);
    }

    .archive-label {
      position: absolute;
      top: -15px;
      left: 30px;
      background: #ffffff;
      padding: 2px 15px;
      font-weight: bold;
      color: #555;
      border: 2px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    body.dark-mode .archive-label {
      background: #121212;
      color: #aaa;
      border-color: #333;
    }

    .floppy-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      cursor: grab;
      transition: transform 0.2s;
    }
    
    .floppy-wrapper:active {
      cursor: grabbing;
    }
    
    .floppy-wrapper:hover {
      transform: scale(1.05) translateY(-5px);
    }
    
    .floppy-img {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .floppy-label {
      position: absolute;
      top: 35%;
      left: 15%;
      width: 70%;
      height: 45%;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      transform: rotate(-2deg);
    }
    
    .floppy-title {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      font-weight: bold;
      color: #000;
      line-height: 1.1;
      margin-top: 15px;
      white-space: normal;
      word-wrap: break-word;
      max-height: 32px;
      overflow: hidden;
      padding: 0 5px;
    }
    
    .floppy-slogan {
      font-family: 'Caveat', cursive;
      font-size: 14px;
      color: #333;
      line-height: 1;
      margin-top: 5px;
    }

    /* App Viewer */
    #app-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1000;
      background: #000;
    }
    
    #app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }

    .reader-container.broken {
      opacity: 0.5;
      pointer-events: none;
      filter: sepia(1) hue-rotate(-50deg) saturate(3);
    }
    
    /* Eject Button Retro Style */
    #eject-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1001;
      padding: 10px 20px;
      background: #d3d3d3; /* Retro plastic gray */
      color: #000;
      border: 4px solid #fff;
      border-bottom-color: #888;
      border-right-color: #888;
      font-family: 'VT323', monospace;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      text-transform: uppercase;
    }
    
    #eject-btn:active {
      border-top-color: #888;
      border-left-color: #888;
      border-bottom-color: #fff;
      border-right-color: #fff;
      transform: translate(2px, 2px);
      box-shadow: none;
    }

      /* Mobile Layout - Dynamic Island Style */
    @media (max-width: 768px) {
      .top-right-controls {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        right: auto;
        background: rgba(238, 238, 238, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 5px 15px;
        border-radius: 0 0 20px 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 80%;
        max-width: 300px;
      }
      
      .reader-container img {
        width: 100px !important;
      }

      body.dark-mode .top-right-controls {
        background: rgba(18, 18, 18, 0.8);
        box-shadow: 0 5px 20px rgba(0,0,0,0.5);
      }

      
      .logo {
        display: none !important;
      }
      
      h1 {
        font-size: 2rem !important;
        letter-spacing: 1px !important;
      }
      
      p.subtitle {
        font-size: 0.9rem !important;
        margin-bottom: 20px !important;
      }

      .main-content {
        padding-top: 130px;
      }

      .archive-box {

        flex-direction: column;
        align-items: center;
        gap: 25px;
        padding: 40px 15px;
      }

      .floppy-wrapper {
        margin: 0 auto;
      }
    }
  </style>
</head>

        }

    setTimeout(() => {
        clearInterval(bootInterval);
        bootScreen.style.display = 'none';
        splashScreen.style.display = 'flex';

            splashScreen.style.display = 'none';
            siteWrapper.style.display = 'block';

    function updateLanguage(lang) {
      if(!translations[lang]) return;
      const t = translations[lang];
      if(document.getElementById('t-subtitle')) document.getElementById('t-subtitle').textContent = t.subtitle;
      if(document.getElementById('t-archive')) document.getElementById('t-archive').textContent = t.archive;
      if(document.getElementById('t-eject')) document.getElementById('t-eject').textContent = t.eject;
      if(document.getElementById('t-broken')) document.getElementById('t-broken').textContent = t.broken;
      if(document.getElementById('t-alpha')) document.getElementById('t-alpha').textContent = t.alpha;

      if(document.getElementById('t-download-title')) document.getElementById('t-download-title').textContent = t.dl_title;
      if(document.getElementById('t-download-text')) document.getElementById('t-download-text').textContent = t.dl_text;
      


      localStorage.setItem('lang', lang);
      document.getElementById('language-select').value = lang;
    }
    
    function getLocalizedUrl(url) {
      if (url.startsWith('http') || url === 'trap') return url;
      const lang = localStorage.getItem('lang') || 'tr';
      return `/${lang}${url.startsWith('/') ? url : '/' + url}`;
    }

    // Language routing logic
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    let urlLang = null;
    
    // Check if the first path segment is a language code
    if (pathSegments.length > 0 && translations[pathSegments[0]]) {
        urlLang = pathSegments[0];
    }

    let activeLang = urlLang || localStorage.getItem('lang') || 'tr';
    
    if (window.location.pathname === '/' || window.location.pathname === '') {
        window.history.replaceState(null, '', '/' + activeLang + '/');
    } else if (urlLang && urlLang !== localStorage.getItem('lang')) {
        localStorage.setItem('lang', urlLang);
    }

    updateLanguage(activeLang);

    document.getElementById('language-select').addEventListener('change', (e) => {
      const newLang = e.target.value;
      localStorage.setItem('lang', newLang);
      
      const segments = window.location.pathname.split('/').filter(Boolean);
      if (segments.length > 0 && translations[segments[0]]) {
          segments[0] = newLang;
      } else {
          segments.unshift(newLang);
      }
      window.location.href = '/' + segments.join('/');
    });
    
    // Original JS starts here
    // Load user preferences
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeIcon.textContent = 'dark_mode';
    } else {
      themeIcon.textContent = 'light_mode';
    }
    
    // Toggle Dark Mode
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeIcon.textContent = isDark ? 'dark_mode' : 'light_mode';
    });

    

    // Render Discs
    projects.forEach(p => {
      const wrapper = document.createElement('div');
      wrapper.className = 'floppy-wrapper';
      wrapper.draggable = true;
      wrapper.id = 'disc-' + p.id;
      
      
      wrapper.addEventListener('dblclick', () => {
        const fakeEvent = { dataTransfer: { getData: () => p.id } };
        dropHandler(fakeEvent);
      });

      wrapper.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', p.id);
        e.dataTransfer.effectAllowed = 'move';
      });

      wrapper.innerHTML = `
        <img src="/assets/discs/floppy-disc.png" class="floppy-img" alt="Floppy Disc" width="150" height="150">
        <div class="floppy-label">
          <div class="floppy-title">${p.title}</div>
        </div>
      `;
      discsContainer.appendChild(wrapper);
    });


    // Contact and Aboutme Disc Drag
    const contactDisc = document.getElementById('disc-contact');
    if (contactDisc) {
      contactDisc.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', 'contact');
        e.dataTransfer.effectAllowed = 'move';
      });
    }
    const idkDisc = document.getElementById('disc-idk15052007');
    if (idkDisc) {
      idkDisc.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', 'idk15052007');
        e.dataTransfer.effectAllowed = 'move';
      });
    }

    // Drag & Drop Handlers
    function dragOverHandler(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      readerContainer.classList.add('drag-over');
    }
    
    function dragLeaveHandler(e) {
      readerContainer.classList.remove('drag-over');
    }

    function dropHandler(e) {
      e.preventDefault();
      readerContainer.classList.remove('drag-over');
      
      if (isBroken) return;
      
      if (currentDisc) {
        isBroken = true;
        readerContainer.classList.add('broken');
        document.getElementById('broken-text').style.display = 'block';
        return;
      }

      const projectId = e.dataTransfer.getData('text/plain');
      if (!projectId) return;

      let project = projects.find(p => p.id === projectId);
      if (projectId === 'contact') {
         project = { id: 'contact', title: 'contact.exe', url: 'https://forms.gle/2yAQQzSyd6Gdju5S6', isDownload: true };
      } else if (projectId === 'idk15052007') {
         project = { id: 'idk15052007', title: 'idk15052007.exe', url: 'trap', isDownload: true };
      }
      if (!project) return;

      // Insert Disc
      currentDisc = projectId;
      
      // Hide dropped floppy
      document.getElementById('disc-' + projectId).style.display = 'none';
      
      // Change reader image
      readerImg.src = '/assets/discs/disc-reader-and-disc.png';

      // Play audio sequence
      discAudio.currentTime = 0;
      fanAudio.currentTime = 0;
      discAudio.play().catch(console.error);
      
      discAudio.onended = () => {
        if (currentDisc) { // still inside
          if (project.isDownload) {
             // Show Win98 progress
             document.getElementById('win98-download').style.display = 'block';
             const previewDiv = document.getElementById('download-preview');
             const previewIframe = document.getElementById('preview-iframe');
             
             if (project.id === 'contact') {
                 document.getElementById('t-download-title').textContent = 'İletişim Başlatılıyor...';
                 document.getElementById('t-download-text').textContent = 'contact.exe yükleniyor...';
                 previewDiv.style.display = 'none';
             } else if (project.id === 'idk15052007') {
                 document.getElementById('t-download-title').textContent = 'Bilinmeyen Dosya...';
                 document.getElementById('t-download-text').textContent = 'idk15052007.exe yükleniyor...';
                 previewDiv.style.display = 'none';
             } else if (project.id === 'retroclock') {
                 document.getElementById('t-download-title').textContent = 'İndiriliyor...';
                 document.getElementById('t-download-text').textContent = project.title + ' yükleniyor...';
                 previewDiv.style.display = 'block';
                 previewIframe.src = getLocalizedUrl(project.url);
             } else {
                 document.getElementById('t-download-title').textContent = 'İndiriliyor...';
                 document.getElementById('t-download-text').textContent = project.title + ' yükleniyor...';
                 previewDiv.style.display = 'none';
             }
             document.getElementById('win98-progress-bar').style.width = '0%';
             let prog = 0;
             let interval = setInterval(() => {
                prog += 10;
                document.getElementById('win98-progress-bar').style.width = prog + '%';
                 if(prog >= 100) {
                   clearInterval(interval);
                   setTimeout(() => {
                     document.getElementById('win98-download').style.display = 'none';
                     previewIframe.src = 'about:blank'; // cleanup
                     if (project.url === 'trap') {
                         openApp('trap');
                     } else {
                         window.open(getLocalizedUrl(project.url), '_blank');
                         ejectDisc();
                     }
                   }, 500);
                }
             }, 200);
          } else {
             fanAudio.play().catch(console.error);
             openApp(getLocalizedUrl(project.url));
          }
        }
      };
    }

    function ejectDisc() {
      if (!currentDisc || isBroken) return; // No disc to eject or reader is broken
      
      // Play Eject Audio
      ejectAudio.currentTime = 0;
      ejectAudio.play().catch(console.error);

      // Stop audio
      discAudio.pause();
      fanAudio.pause();
      
      // Show disc again
      document.getElementById('disc-' + currentDisc).style.display = 'block';
      currentDisc = null;

      // Reset reader image
      readerImg.src = '/assets/discs/disc-reader.png';
      
      // Close app and trap
      appViewer.style.display = 'none';
      document.getElementById('rickroll-trap').style.display = 'none';
      appIframe.style.display = 'block';
      appIframe.src = 'about:blank';
      
      // Stop video if it was playing
      const appVideo = document.getElementById('app-video');
      appVideo.pause();
      appVideo.currentTime = 0;
      appVideo.style.display = 'none';
    }

    function openApp(url) {
      if (url === 'trap') {
        appIframe.src = 'about:blank';
        appIframe.style.display = 'none';
        document.getElementById('app-video').style.display = 'none';
        document.getElementById('rickroll-trap').style.display = 'flex';
        appViewer.style.display = 'flex';
      } else {
        document.getElementById('rickroll-trap').style.display = 'none';
        document.getElementById('app-video').style.display = 'none';
        appIframe.style.display = 'block';
        appIframe.src = url;
        appViewer.style.display = 'flex';
      }
    }

    function triggerRickRoll() {
      document.getElementById('rickroll-trap').style.display = 'none';
      appIframe.style.display = 'none';
      
      const appVideo = document.getElementById('app-video');
      appVideo.style.display = 'block';

      appVideo.play().catch(e => console.error("Auto-play failed", e));
    }


    // Mobile Touch Drag Delay Logic for all discs (Dynamic + Static)
    document.querySelectorAll('.floppy-wrapper').forEach(w => {
      // Ensure all disks have double click (the dynamic ones already have it, but static ones need it)
      w.ondblclick = (e) => {
        let discId = w.id.replace('disc-', '');
        if (discId) dropHandler({ dataTransfer: { getData: () => discId } });
      };
      
            // Mobile Drag Delay Setup
      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      
      if (isTouchDevice) {
          w.draggable = false; 
          let dragTimeout;
          w.addEventListener('touchstart', function(e) {
             if (w.getAttribute('data-drag-ready') !== 'true') {
                 dragTimeout = setTimeout(() => {
                     w.draggable = true;
                     w.setAttribute('data-drag-ready', 'true');
                     if(navigator.vibrate) navigator.vibrate(30);
                 }, 400); // 400ms hold to drag
             }
          }, {passive: true});
          
          w.addEventListener('touchend', function(e) {
             clearTimeout(dragTimeout);
             setTimeout(() => {
                 w.draggable = false;
                 w.removeAttribute('data-drag-ready');
             }, 100);
          }, {passive: true});
          
          w.addEventListener('touchmove', function(e) {
             if (w.getAttribute('data-drag-ready') !== 'true') {
                 clearTimeout(dragTimeout);
             }
          }, {passive: true});
      } else {
          w.draggable = true;
      }
    });
  </script>
